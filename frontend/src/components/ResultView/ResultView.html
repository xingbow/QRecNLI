            <el-collapse-item title="SQL results and explanations" name="2">
                <SQLExplanation :sqlQuery="sqlQuery" :nlExplanation="explanation" :selectDecoded="selectDecoded" :groupbyDecoded="groupbyDecoded" :whereDecoded="whereDecoded" :tables="tables" />

        <div id="vegaLiteContainer">
            <div v-if="isGenerating" class="generating-results">
                <div class="loading-spinner">
                    <i class="el-icon-loading"></i>
                    <span style="margin-left: 10px;">Generating results...</span>
                </div>
            </div>
            <draggable v-else class="list-group" :list="queryReturns" handle="none" group="historyNode">
                <div class="list-group-item-invisible" v-for="(qRet, index) in queryReturns" :key="qRet.id">
                    <DraggableTop :qRet="qRet" :onDelete="()=>onDelete(index)" @bookmark-changed="onBookmarkChanged">
                        <template v-slot:setting-popover>
                            <!-- Configuration will be handled by individual components -->
                        </template>
                        <template v-slot:info-popover>
                            <SQLExplanation 
                            :sqlQuery="qRet.sqlQuery" 
                            :nlExplanation="qRet.nlExplanation" 
                            :tables="tables" />
                        </template>
                    </DraggableTop>
                </div>
            </draggable>
        </div>
